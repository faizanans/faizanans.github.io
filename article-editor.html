<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article Editor — Faizan Ansari</title>
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <header class="site-nav" id="site-nav">
        <div class="nav-inner">
            <a class="nav-brand" href="index.html">Faizan Ansari</a>
            <nav class="nav-links" id="nav-links" aria-label="Main">
                <a href="experience.html">Experience</a>
                <a href="projects.html">Projects</a>
                <a href="articles.html">Articles</a>
            </nav>
            <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <!-- Editor Container -->
    <div class="editor-container">
        <div class="editor-header">
            <h1>Article Editor</h1>
            <p class="subtitle">Write your article in Markdown</p>
        </div>

        <div class="editor-grid">
            <!-- Editor Panel -->
            <div class="editor-panel">
                <h2>Editor</h2>
                <form id="article-form">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" id="title" name="title" required placeholder="Enter article title...">
                    </div>

                    <div class="form-group">
                        <label for="excerpt">Excerpt</label>
                        <input type="text" id="excerpt" name="excerpt" required placeholder="Short description...">
                    </div>

                    <div class="form-group">
                        <label for="content">Content (Markdown)</label>
                        <textarea id="content" name="content" required placeholder="Write your article in Markdown..."></textarea>
                    </div>
                </form>
            </div>

            <!-- Preview Panel -->
            <div class="editor-panel">
                <h2>Preview</h2>
                <div id="preview" class="preview-content article-content">
                    <p class="caption">Start typing to see preview...</p>
                </div>
            </div>
        </div>

        <div class="editor-actions">
            <button type="button" class="cancel-btn" onclick="window.location.href='articles.html'">Cancel</button>
            <button type="button" class="save-btn" onclick="saveDraft()">Save Draft</button>
            <button type="button" class="publish-btn" onclick="publishArticle()">Publish</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="scripts/navigation.js"></script>
    <script src="scripts/article-editor.js"></script>
</body>
</html>
